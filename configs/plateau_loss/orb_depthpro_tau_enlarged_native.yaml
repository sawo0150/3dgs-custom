# exp25: enlarged tau + quadratic + 2-phase lambda schedule
#
# vs exp19 (best so far, -0.26dB):
#   alpha_n: 0.4 → 0.8   (2x)
#   alpha_t: 0.9 → 1.8   (2x)
#   tau_n_max: 0.30 → 0.80 m  (2.7x)
