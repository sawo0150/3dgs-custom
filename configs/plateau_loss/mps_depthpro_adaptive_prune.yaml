#     d_euc > 1.5m  AND  (opacity > 0.5 OR max_scale > 0.15m)
#   prune_interval=500   → frequent pruning (every 500 iters)
#   loss: same quadratic opacity-weighted (λ=0.10) as exp21

enabled: true
type: ellipsoidal

