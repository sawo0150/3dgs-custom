enabled: true
type: ellipsoidal

anchor_path: /home/wosas/Desktop/Incremental_mapping_test/gs_floaterLab/results/diagnostic/plateau_ellipsoid_v4_20260705_041132/anchors_all_metric3d.npy
obs_min: 0          # ignored when anchor_path is set

knn_k: 5
knn_iso_mult: 0     # disabled: virtual anchors already uniformly spaced

alpha_n: 0.4
alpha_t: 0.9
tau_min: 0.03
tau_n_max: 0.30
